name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - Main
      - stg
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@V1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker 2 use gcloud as a credential helper
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pagina-pessoal/my-projects-prod:latest"
          docker build -t "$IMAGE_URI" PaginaPessoal
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy my-service-prod  \
            --image "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pagina-pessoal/my-project-prod:latest" \
            --region ${{ secrets.GCP_REGION }} \
            --projetc ${{ secrets.GCP_PROJECT_ID }} \ 
            --service-account ${{ secrets.GCP_SA_KEY }} \
            
